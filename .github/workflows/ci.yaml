name: CI

on:
    push:
    pull_request:

jobs:
    qa:
        name: QA (PHP ${{ matrix.php }}, ${{ matrix.dependencies }} deps)
        runs-on: ubuntu-latest
        strategy:
            matrix:
                php: ['8.4', '8.5']
                dependencies: ['highest', 'lowest']
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none

            - name: Install highest dependencies
              if: matrix.dependencies == 'highest'
              run: composer update --no-interaction --no-progress

            - name: Install lowest dependencies
              if: matrix.dependencies == 'lowest'
              run: composer update --prefer-lowest --prefer-stable --no-interaction --no-progress

            - name: Coding standard
              run: vendor/bin/phpcs --standard=phpcs.xml --extensions=php --encoding=utf-8 -sp src tests

            - name: Static analysis
              run: vendor/bin/phpstan analyse --configuration=phpstan.neon --memory-limit=512M

            - name: Tests
              run: vendor/bin/phpunit --configuration=phpunit.xml
